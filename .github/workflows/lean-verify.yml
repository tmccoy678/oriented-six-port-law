name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-six-port-law:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence repository
        uses: actions/checkout@v4

      - name: Reproduce frozen SAT instance
        shell: bash
        run: |
          python3 sat/synth_three_star_return_sat.py encode-tight "$RUNNER_TEMP/L_meta_9753_three_star_tight.cnf"
          printf '%s  %s\n' \
            '93259dc4c97f3291d8e59f94ddf759d7d5d8131d13517de002ecaf6c63beba6c' \
            "$RUNNER_TEMP/L_meta_9753_three_star_tight.cnf" | sha256sum --check -

      - name: Reproduce paired shared-parent instance
        shell: bash
        run: |
          python3 sat/synth_shared_parent_L_meta_9753.py \
            init "$RUNNER_TEMP/L-meta-9753-shared-parent-examples.json"
          python3 sat/synth_shared_parent_L_meta_9753.py \
            encode "$RUNNER_TEMP/L-meta-9753-shared-parent-examples.json" \
            "$RUNNER_TEMP/L-meta-9753-shared-parent.cnf" 1
          printf '%s  %s\n' \
            '95e232dbe9adf62c7702f27e0f389f504eed12d10661cb4aa55068c81815b3bf' \
            "$RUNNER_TEMP/L-meta-9753-shared-parent-examples.json" | sha256sum --check -
          printf '%s  %s\n' \
            'e4a292d03c158626708063770a5f0fa0b24a1995f4b3a8ab0b8ce290901cb35c' \
            "$RUNNER_TEMP/L-meta-9753-shared-parent.cnf" | sha256sum --check -

      - name: Check out pinned authoritative proof
        uses: actions/checkout@v4
        with:
          repository: tmccoy678/riemann-green-spiral
          ref: c5ed58c1835c6716521361c2ea78c5273212b916
          path: proof
          persist-credentials: false

      - name: Verify pinned proof bytes
        shell: bash
        run: |
          test "$(git -C proof rev-parse HEAD)" = "c5ed58c1835c6716521361c2ea78c5273212b916"
          printf '%s  %s\n' \
            '2c22d6d816e7fd33cffe55db3404a33fedc5f5f63457070c2a1b28171ed2a3bf' \
            'proof/Riemann/OrientedSixPort.lean' | sha256sum --check -

      - name: Build and audit the oriented six-port law
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proof
          build: true
          build-args: Riemann.OrientedSixPort
          test: false
          axiom-audit: true
          axiom-audit-root: Riemann
          use-github-cache: true

  verify-intrinsic-six-state:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out pinned P = NP proof environment
        uses: actions/checkout@v4
        with:
          repository: tmccoy678/pequalnp-proofs
          ref: fff8fe2fb81a0184a99b80348810e1d8147ff2c2
          path: pnp
          persist-credentials: false

      - name: Build the pinned relabeling dependency
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: pnp/lean
          build: true
          build-args: PEqualNP.MetaComplexity.Helpers.PermInputs
          test: false
          use-github-cache: true

      - name: Verify the intrinsic six-state Lean package
        shell: bash
        run: ./scripts/verify-intrinsic-six-state.sh "$GITHUB_WORKSPACE/pnp"

      - name: Reproduce the internal-hand SAT instance
        shell: bash
        run: |
          python3 sat/synth_three_star_return_sat.py encode \
            "$RUNNER_TEMP/three-star-unrestricted.cnf"
          printf '%s  %s\n' \
            'c903f0cc36f4678ebe2eb8bc156d4225d7c88e19958dac117d331d67e304cdd9' \
            "$RUNNER_TEMP/three-star-unrestricted.cnf" | sha256sum --check -
          python3 sat/build_intrinsic_six_state_cnf.py \
            "$RUNNER_TEMP/three-star-unrestricted.cnf" \
            "$RUNNER_TEMP/intrinsic-six-state.cnf" \
            "$RUNNER_TEMP/intrinsic-six-state.json"
          printf '%s  %s\n' \
            '51fac531f709e1eb2d64c3a0a0958618f27f0e1b76047ded204cb7d9525e48e7' \
            "$RUNNER_TEMP/intrinsic-six-state.cnf" | sha256sum --check -
